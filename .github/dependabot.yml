# Dependency update PRs. Solo project: a weekly, low-volume schedule, grouped to limit noise.
# Pull requests target `dev` (see docs/CONTRIBUTING.md); promote to `main` after review.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: "/apps/web"
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      web-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: pip
    directory: "/packages/pipeline"
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: "/services/infra"
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: docker
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: "/apps/web"
    target-branch: dev
    schedule:
      interval: weekly
