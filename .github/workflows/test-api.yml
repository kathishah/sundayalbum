name: Test API + Handlers

on:
  pull_request:
    paths:
      - "services/api/**"
      - "services/handlers/**"
      - "tests/api/**"
      - "tests/handlers/**"
      - "packages/pipeline/src/storage/**"
      - "packages/pipeline/src/steps/**"
  push:
    paths:
      - "services/api/**"
      - "services/handlers/**"
      - "tests/api/**"
      - "tests/handlers/**"
      - "packages/pipeline/src/storage/**"
      - "packages/pipeline/src/steps/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install \
            pytest \
            "moto[dynamodb,s3,ses,stepfunctions]>=5.0.0" \
            boto3 \
            numpy \
            Pillow \
            opencv-python-headless \
            scipy \
            scikit-image \
            anthropic \
            openai \
            click \
            python-dotenv

      - name: Run API and handler tests
        run: pytest tests/api/ tests/handlers/ -v
        env:
          PYTHONPATH: ${{ github.workspace }}
