name: Test API + Handlers

on:
  pull_request:
    paths:
      - "services/api/**"
      - "services/handlers/**"
      - "tests/api/**"
      - "tests/handlers/**"
      - "packages/pipeline/src/storage/**"
      - "packages/pipeline/src/steps/**"
  push:
    paths:
      - "services/api/**"
      - "services/handlers/**"
      - "tests/api/**"
      - "tests/handlers/**"
      - "packages/pipeline/src/storage/**"
      - "packages/pipeline/src/steps/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install \
            pytest \
            "moto[dynamodb,s3,ses,stepfunctions]>=5.0.0" \
            boto3 \
            numpy \
            Pillow \
            opencv-python-headless \
            scipy \
            scikit-image \
            anthropic \
            openai \
            click \
            python-dotenv

      - name: Run API and handler tests
        run: pytest tests/api/ tests/handlers/ -v
        env:
          PYTHONPATH: ${{ github.workspace }}
