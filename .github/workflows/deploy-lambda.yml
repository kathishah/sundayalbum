name: Deploy Lambda Functions

on:
  push:
    branches: [main, dev]
    paths:
      - "services/api/**"
      - "services/handlers/**"
      - "packages/pipeline/**"
      - "Dockerfile"
      - ".github/workflows/deploy-lambda.yml"
  workflow_dispatch:
    inputs:
      stage:
        description: "Stage to deploy (dev or prod)"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - prod

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-west-2
  # Set as a repository secret (Settings > Secrets and variables > Actions): AWS_ACCOUNT_ID.
  # A secret (not a variable) so the value is masked in public workflow logs.
  ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

# Determine stage once, reused in both jobs via outputs
jobs:
  resolve-stage:
    name: Resolve stage
    runs-on: ubuntu-latest
    outputs:
      stage: ${{ steps.stage.outputs.stage }}
      suffix: ${{ steps.stage.outputs.suffix }}
    steps:
      - name: Determine stage and suffix
        id: stage
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_STAGE: ${{ github.event.inputs.stage }}
        run: |
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            STAGE="${INPUT_STAGE}"
          elif [ "${REF_NAME}" = "main" ]; then
            STAGE="prod"
          else
            STAGE="dev"
          fi
          SUFFIX=$([ "$STAGE" = "prod" ] && echo "" || echo "-${STAGE}")
          echo "stage=${STAGE}" >> $GITHUB_OUTPUT
          echo "suffix=${SUFFIX}" >> $GITHUB_OUTPUT
          echo "Deploying to stage=${STAGE} (suffix='${SUFFIX}')"

  # ── Job 1: API Lambda functions (zip-based) ───────────────────────────────
  # Deploys: sa-auth, sa-jobs, sa-websocket, sa-settings, sa-broadcaster
  deploy-api:
    name: Deploy API Lambdas (${{ needs.resolve-stage.outputs.stage }})
    needs: resolve-stage
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: arn:aws:iam::${{ env.ACCOUNT_ID }}:role/github-actions-sundayalbum
          aws-region: ${{ env.AWS_REGION }}

      - name: Zip API code
        run: |
          cd services/api
          zip -r ../../api.zip .
          echo "API zip: $(du -sh ../../api.zip | cut -f1)"

      - name: Update API Lambda functions
        run: |
          SUFFIX="${{ needs.resolve-stage.outputs.suffix }}"
          for fn in auth jobs websocket settings broadcaster; do
            FN_NAME="sa-${fn}${SUFFIX}"
            echo "Updating ${FN_NAME}..."
            aws lambda update-function-code \
              --function-name "${FN_NAME}" \
              --zip-file fileb://api.zip \
              --no-cli-pager
            aws lambda wait function-updated --function-name "${FN_NAME}"
            echo "${FN_NAME} ✓"
          done

  # ── Job 2: Pipeline Lambda functions (Docker/ARM64 container image) ───────
  # Deploys: sa-pipeline-{load,normalize,page-detect,perspective,photo-detect,
  #          photo-split,ai-orient,glare-remove,geometry,color-restore,finalize}
  deploy-pipeline:
    name: Deploy Pipeline Lambdas (${{ needs.resolve-stage.outputs.stage }})
    needs: resolve-stage
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: arn:aws:iam::${{ env.ACCOUNT_ID }}:role/github-actions-sundayalbum
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up QEMU (ARM64 cross-build support)
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Resolve ECR repo for stage
        id: ecr
        run: |
          STAGE="${{ needs.resolve-stage.outputs.stage }}"
          # Each stage has its own dedicated ECR repo:
          #   dev  → sundayalbum-pipeline-dev  (MUTABLE tags — no collision possible)
          #   prod → cdk-hnb659fds-container-assets-* (IMMUTABLE tags — CDK-managed)
          if [ "${STAGE}" = "prod" ]; then
            ECR_REPO="${ACCOUNT_ID}.dkr.ecr.us-west-2.amazonaws.com/cdk-hnb659fds-container-assets-${ACCOUNT_ID}-us-west-2"
          else
            ECR_REPO="${ACCOUNT_ID}.dkr.ecr.us-west-2.amazonaws.com/sundayalbum-pipeline-dev"
          fi
          echo "repo=${ECR_REPO}" >> $GITHUB_OUTPUT
          echo "ECR repo: ${ECR_REPO}"

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Build and push pipeline image (linux/arm64)
        id: image
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          ECR_REPO="${{ steps.ecr.outputs.repo }}"
          IMAGE_URI="${ECR_REPO}:${SHORT_SHA}"

          docker buildx build \
            --platform linux/arm64 \
            --provenance=false \
            --push \
            -t "${IMAGE_URI}" \
            .

          echo "uri=${IMAGE_URI}" >> $GITHUB_OUTPUT
          echo "Built and pushed: ${IMAGE_URI}"

      - name: Update pipeline Lambda functions
        run: |
          SUFFIX="${{ needs.resolve-stage.outputs.suffix }}"
          IMAGE_URI="${{ steps.image.outputs.uri }}"

          for fn in load normalize page-detect perspective photo-detect photo-split ai-orient glare-remove geometry color-restore finalize; do
            FN_NAME="sa-pipeline-${fn}${SUFFIX}"
            echo "Updating ${FN_NAME}..."
            aws lambda update-function-code \
              --function-name "${FN_NAME}" \
              --image-uri "${IMAGE_URI}" \
              --no-cli-pager
            aws lambda wait function-updated --function-name "${FN_NAME}"
            echo "${FN_NAME} ✓"
          done
